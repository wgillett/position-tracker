firm: fidelity
login_url: https://digital.fidelity.com/ftgw/digital/portfolio/positions
positions_url: https://digital.fidelity.com/ftgw/digital/portfolio/positions

# CSS selectors used to scrape the positions page (login-state detection is
# URL-based and needs no selector -- see FidelityScraper.is_logged_in).
#
# Fidelity's positions grid is an ag-Grid table: each account and its
# holdings are flat, sibling rows (not nested containers). An `account_row`
# is followed by that account's `position_row`s until the next account row.
#
# ag-Grid also splits each *logical* row into two DOM elements sharing a
# `row-id` attribute: a pinned "Symbol" column fragment (symbol/description,
# or account name/number) and a scrollable "center columns" fragment
# (quantity/value, etc.) -- neither fragment alone has every cell.
# FidelityScraper groups fragments by row-id and merges cell lookups across
# them. Some logical rows are section-header dividers (e.g. "Cash / HELD IN
# MONEY MARKET", "Account total") rather than real holdings/accounts --
# these are detected and skipped by checking for missing cells even after
# merging fragments.
#
# All selectors below were confirmed against a live session. ag-Grid only
# renders columns that fit the viewport, which is why runner.py and the live
# test use a wide one (2400px) -- if `track fidelity` errors while parsing a
# row, run `uv run pytest -m live tests/live/test_fidelity_live.py -s` to
# check match counts and correct them.
#
# The grid has more columns than we currently scrape, in this left-to-right
# order: Symbol, Last price, Last price change, Today's gain/loss $, Today's
# gain/loss %, Total gain/loss $, Total gain/loss %, Current value, % of
# account, Quantity, Average cost basis, Cost basis total, 52-week range.
# We only use Symbol (+ its description), Quantity, and Current value today.
selectors:
  account_row: ".posweb-row-account"
  account_name: ".posweb-cell-account_primary"
  account_number: ".posweb-cell-account_secondary"
  position_row: ".posweb-row-position"
  symbol: ".posweb-cell-symbol-name_container > span"
  description: ".posweb-cell-symbol-description"
  quantity: ".posweb-cell-quantity_value"
  market_value: ".posweb-cell-current_value"
