[project]
name = "position-tracker"
version = "0.1.0"
description = "Pull balances from personal financial accounts via web scraping"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "keyring>=25.5",
    "playwright>=1.48",
]

[project.scripts]
track = "position_tracker.cli:track"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/position_tracker"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "pre-commit>=4.0",
    "invoke>=2.2",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that hit real institution websites (never run by default)",
]
addopts = "-m 'not live'"
